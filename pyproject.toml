[project]
name = "youtubestock"
version = "0.1.0"
description = "YouTube channel monitor and video/audio downloader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2024.12.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "markdown>=3.5.0",
    "typer>=0.9.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "tavily-python>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
youtubestock = "cli:app"
