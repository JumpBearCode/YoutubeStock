[project]
name = "youtubestock"
version = "0.1.0"
description = "YouTube channel monitor and video/audio downloader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2024.12.0",
    "feedparser>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
youtubestock = "src.cli:main"
